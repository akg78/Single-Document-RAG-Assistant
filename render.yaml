services:
  - type: web
    name: single-document-rag-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: PRELOAD_MODELS
        value: "true"
      - key: CORS_ORIGINS
        value: https://single-document-rag-assistant.vercel.app,http://localhost:3000
